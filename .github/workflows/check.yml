name: Native package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::pkgload
          needs: check
      - run: Rscript tools/check.R
      - name: Build and check documented examples
        shell: Rscript {0}
        run: rcmdcheck::rcmdcheck(args=c("--no-manual", "--no-tests"), error_on="warning")
